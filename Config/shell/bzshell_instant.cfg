//
// CREATE VARIABLES
//
ConfigureVarSys()
{
	CreateInteger("options.instant.introScene", 0);
	SetIntegerRange("options.instant.introScene", 0, 1);

	CreateInteger("options.instant.wildlife", 0);
	SetIntegerRange("options.instant.wildlife", 0, 1);

	CreateInteger("options.instant.aiCommander", 0);
	SetIntegerRange("options.instant.aiCommander", 0, 1);

	CreateInteger("options.instant.difficulty", 1);
	SetIntegerRange("options.instant.difficulty", 0, 2);

	CreateInteger("options.instant.pilotMode", 0);
	SetIntegerRange("options.instant.pilotMode", 0, 1);

	CreateInteger("options.instant.infantry", 0);
	SetIntegerRange("options.instant.infantry", 0, 1);
}

